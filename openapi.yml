                    description: Current status of the upload job
                  kind:
                    type: string
                    enum: ["course_offerings", "facilities"]
                    description: The type of data that was uploaded
                  stats:
                    description: Kind-specific statistics for the upload job. Values will be 0 until processing is `completed`.
                    oneOf:
                      - $ref: "#/components/schemas/CourseOfferingsUploadStats"
                      - $ref: "#/components/schemas/FacilitiesUploadStats"
                  message:
                    type: string
                    description: Human-readable status message
              examples:
                CompletedStatus:
                  summary: Job completed successfully
                  value:
                    id: "upload_12345"
                    status: "completed"
                    kind: "course_offerings"
                    stats:
                      files_total: 12
                      files_processed: 10
                      files_skipped: 2
                      courses_seen: 50
                      courses_added: 47
                      courses_modified: 3
                      sections_seen: 1612
                      sections_added: 1523
                      sections_modified: 89
                    message: "Dataset processing complete"
                FailedStatus:
                  summary: Job failed during validation
                  value:
                    id: "upload_12346"
                    status: "failed"
                    kind: "course_offerings"
                    stats:
                      files_total: 0
                      files_processed: 0
                      files_skipped: 0
                      courses_seen: 0
                      courses_added: 0
                      courses_modified: 0
                      sections_seen: 0
                      sections_added: 0
                      sections_modified: 0
                    message: "Data is not in a valid zip format"
                ProcessingStatus:
                  summary: Job still processing
                  value:
                    id: "upload_12347"
                    status: "processing"
                    kind: "course_offerings"
                    stats:
                      files_total: 0
                      files_processed: 0
                      files_skipped: 0
                      courses_seen: 0
                      courses_added: 0
                      courses_modified: 0
                      sections_seen: 0
                      sections_added: 0
                      sections_modified: 0
                    message: "Processing in progress"
                CompletedFacilitiesStatus:
                  summary: Facilities job completed successfully
                  value:
                    id: "upload_12348"
                    status: "completed"
                    kind: "facilities"
                    stats:
                      buildings_added: 48
                      buildings_modified: 4
                      rooms_added: 352
                      rooms_modified: 12
                    message: "Dataset processing complete"
        "404":
          description: The upload job does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
              example:
                error: "Not found"
                message: "no dataset with id 'upload_12345'"

  /api/v1/search:
    post:
      deprecated: true
      summary: Search resources
      description: |-
        Deprecated. Use /api/v2/search.

        Execute a query using a JSON-based domain-specific language (DSL) to search resources.

        The query object has three main components:
        - `WHERE` filters which records should be included in the results.
        - `COLUMNS` selects which keys are included in each result.
        - `ORDER` sorts the results by a key in `COLUMNS`.

        #### Query Grammar

        The DSL grammar is defined using [EBNF](https://en.wikipedia.org/wiki/Extended_Backus–Naur_form):

        ```ebnf
        QUERY ::='{' BODY ', ' OPTIONS '}'

        // Note: a BODY with no FILTER (i.e. WHERE:{}) matches all entries.
        BODY ::= 'WHERE:{' FILTER? '}'

        FILTER ::= LOGICCOMPARISON | MCOMPARISON | SCOMPARISON | NEGATION

        LOGICCOMPARISON ::= LOGIC ':[' FILTER_LIST ']'
        MCOMPARISON ::= MCOMPARATOR ':{' mkey ':' number '}'
        SCOMPARISON ::= 'IS:{' skey ': "' [*]? inputstring [*]? '" }'  // Asterisks at the beginning or end of the inputstring should act as wildcards.
        NEGATION ::= 'NOT :{' FILTER '}'

        FILTER_LIST ::= '{' FILTER '}' | '{' FILTER '}, ' FILTER_LIST // comma separated list of filters containing at least one filter
        LOGIC ::= 'AND' | 'OR'
        MCOMPARATOR ::= 'LT' | 'GT' | 'EQ'

        OPTIONS ::= 'OPTIONS:{' COLUMNS '}' | 'OPTIONS:{' COLUMNS ', ORDER:' key '}'

        COLUMNS ::= 'COLUMNS:[' KEY_LIST ']'

        KEY_LIST ::= key | key ', ' KEY_LIST // comma separated list of keys containing at least one key

        key ::= mkey | skey
        mkey ::= '"' mfield '"'
        skey ::= '"' sfield '"'
        mfield ::= 'avg' | 'pass' | 'fail' | 'audit' | 'year'
        sfield ::=  'title' | 'dept' | 'code' | 'instructor'
        inputstring ::= [^*]* // Zero or more of any character, except asterisk.
        ```

        #### Wildcards

        You can use optional asterisks (`*`) in `IS` comparisons to match patterns.
        For example, `"IS": {"dept": "C*"}` matches any department that starts with "C".
        Because the asterisks can appear at the beginning and/or end, there are four possible forms:
        ```
        inputstring: Matches inputstring exactly
        *inputstring: Ends with inputstring
        inputstring*: Starts with inputstring
        *inputstring*: Contains inputstring
        ```
        Asterisks in the middle are not allowed (for example, `input*string`).

        #### Order

        You can sort results by specifying the ORDER field with any key that appears in your COLUMNS list.

        If ORDER is not specified, results may appear in any order.

        **Ties**.
        When sorting produces tied values, the relative order of those entries is not guaranteed.
        For example, if you sort by department, all CPSC entries will be grouped together, but individual CPSC entries may appear in any order within that group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              searchEasyCourses:
                summary: Basic query
                description: This query produces course offerings that have an average greater than 99.
                value:
                  kind: course_offerings
                  query:
                    {
                      WHERE:{
                        GT:{
                            "avg":99
                        }
                      },
                      "OPTIONS":{
                        "COLUMNS":[
                            "dept",
                            "avg"
                        ],
                        "ORDER":"avg"
                      }
                  }

              searchFullQuery:
                summary: Complex query
                description: A query that uses most components of the query DSL.
                value:
                  kind: course_offerings
                  query: {
                    "WHERE":{
                      "OR":[
                          {
                            "AND":[
                                {
                                  "GT":{
                                      "avg":90
                                  }
                                },
                                {
                                  "IS":{
                                      "dept":"adhe"
                                  }
                                }
                            ]
                          },
                          {
                            "EQ":{
                                "avg":95
                            }
                          }
                      ]
                    },
                    "OPTIONS":{
                      "COLUMNS":[
                          "dept",
                          "avg"
                      ],
                      "ORDER":"avg"
                    }
                  }
      responses:
