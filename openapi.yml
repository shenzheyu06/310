components:
  schemas:
    Course:
      type: object
      description: All properties are included in the response.
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          description: The title of the course.
        dept:
          type: string
          description: The department that offers the course.
        code:
          type: string
          description: The course code identifier.
        links:
          type: object
          readOnly: true
          properties:
            self:
              type: string
              format: uri-reference
            sections:
              description: URL to the sections endpoint for this course
              type: string
              format: uri-reference
    SearchRequest:
      type: object
      required:
        - kind
        - query
      properties:
        kind:
          type: string
          enum: ["course_offerings", "facilities"]
          description: The type of resource to query.
        query:
          type: object
          description: A query object that follows the DSL grammar defined in the EBNF.
    CourseOfferingsUploadStats:
      type: object
      description: Statistics for a `course_offerings` upload job.
      properties:
        files_total:
          type: integer
          minimum: 0
          description: Total number of files found in the courses/ directory
        files_processed:
          type: integer
          minimum: 0
          description: Number of files successfully processed (contained valid JSON with a `result` property)
        files_skipped:
          type: integer
          minimum: 0
          description: Number of files skipped (invalid JSON or missing `result` property)
        courses_seen:
          type: integer
          minimum: 0
          description: Number of course resources identified in the upload
        courses_added:
          type: integer
          minimum: 0
          description: Number of new course resources created
        courses_modified:
          type: integer
          minimum: 0
          description: Number of existing course resources updated
        sections_seen:
          type: integer
          minimum: 0
          description: Number of section resources identified in the upload
        sections_added:
          type: integer
          minimum: 0
          description: Number of new section resources created
        sections_modified:
          type: integer
          minimum: 0
          description: Number of existing section resources updated
    FacilitiesUploadStats:
      type: object
      description: Statistics for a `facilities` upload job.
      properties:
        buildings_added:
          type: integer
          minimum: 0
          description: Number of new building resources created
        buildings_modified:
          type: integer
          minimum: 0
          description: Number of existing building resources updated
        rooms_added:
          type: integer
          minimum: 0
          description: Number of new room resources created
        rooms_modified:
          type: integer
          minimum: 0
          description: Number of existing room resources updated
    Section:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        instructor:
          description: The instructor's full name.
          example: smith, john will
          type: string
        year:
          type: integer
          minimum: 1900
          maximum: 2099
          description: The year in which the section was offered.
        avg:
          type: number
          minimum: 0
          maximum: 100
          description: The average grade of students enroled in the section.
        pass:
          type: integer
          minimum: 0
          description: The number of students in the section who achieved a passing grade.
        fail:
          type: integer
          minimum: 0
          description: The number of students in the section who did not achieve a passing grade.
        audit:
          type: integer
          minimum: 0
          description: The number of students in the section who audited the course.
        links:
          type: object
          readOnly: true
          properties:
            self:
              type: string
              format: uri-reference
            course:
              description: URL to the parent course
              type: string
              format: uri-reference
    Building:
      type: object
      description: All properties are included in the response.
      properties:
        id:
          type: string
          readOnly: true
          description: Building short name identifier.
        name:
          type: string
          description: The full name of the building.
        address:
          type: string
          description: The building address.
        lat:
          type: number
          description: The latitude of the building.
        lon:
          type: number
          description: The longitude of the building.
        links:
          type: object
          readOnly: true
          properties:
            self:
              type: string
              format: uri-reference
            rooms:
              description: URL to the rooms endpoint for this building
              type: string
              format: uri-reference
    Room:
      type: object
      description: All properties are included in the response.
      properties:
        id:
          type: string
          readOnly: true
          description: Room identifier.
        building:
          type: string
          description: The parent building shortname identifier.
        number:
          type: string
          description: The room number. Not always a number so represented as a string.
        type:
          type: string
          description: The room type.
        furniture:
          type: string
          description: The room furniture description.
        href:
          type: string
          description: Link to full room details.
        seats:
          type: integer
          minimum: 0
          description: The number of seats in the room.
        links:
          type: object
          readOnly: true
          properties:
            self:
              type: string
              format: uri-reference
            building:
              description: URL to the parent building
              type: string
              format: uri-reference
