  /api/v2/search:
    post:
      summary: Search resources
      description: |-
        Execute a query using a JSON-based domain-specific language (DSL) to search resources.

        The query object has three main components:
        - `WHERE` filters which records should be included in the results.
        - `COLUMNS` selects which keys are included in each result.
        - `ORDER` sorts the results by a key in `COLUMNS`.

        **Important:** All fields used in a query must belong to the same `kind`. You cannot mix course_offerings fields with facilities fields in a single query.

        #### Query Grammar

        The DSL grammar is defined using [EBNF](https://en.wikipedia.org/wiki/Extended_Backus–Naur_form):

        ```ebnf
        QUERY ::='{' BODY ', ' OPTIONS '}' | '{' BODY ', ' OPTIONS ', ' TRANSFORMATIONS '}'

        // Note: a BODY with no FILTER (i.e. WHERE:{}) matches all entries.
        BODY ::= 'WHERE:{' FILTER? '}'

        FILTER ::= LOGICCOMPARISON | MCOMPARISON | SCOMPARISON | NEGATION

        LOGICCOMPARISON ::= LOGIC ':[' FILTER_LIST ']'
        MCOMPARISON ::= MCOMPARATOR ':{' mkey ':' number '}'
        SCOMPARISON ::= 'IS:{' skey ': "' [*]? inputstring [*]? '" }'  // Asterisks at the beginning or end of the inputstring should act as wildcards.
        NEGATION ::= 'NOT :{' FILTER '}'

        FILTER_LIST ::= '{' FILTER '}' | '{' FILTER '}, ' FILTER_LIST // comma separated list of filters containing at least one filter
        LOGIC ::= 'AND' | 'OR'
        MCOMPARATOR ::= 'LT' | 'GT' | 'EQ'

        OPTIONS ::= 'OPTIONS:{' COLUMNS '}' | 'OPTIONS:{' COLUMNS ', ' SORT '}'

        SORT ::= 'ORDER: { dir:'  DIRECTION ', keys: [ ' ANYKEY_LIST '] }' | 'ORDER: ' ANYKEY
        DIRECTION ::= 'UP' | 'DOWN'

        TRANSFORMATIONS ::= 'TRANSFORMATIONS: {' GROUP ', ' APPLY '}'
        GROUP ::= 'GROUP: [' KEY_LIST ']'
        APPLY ::= 'APPLY: [' APPLYRULE_LIST? ']'
        APPLYRULE_LIST ::=  APPLYRULE | APPLYRULE ', ' APPLYRULE_LIST
        APPLYRULE ::= '{' applykey ': {' APPLYTOKEN ':' KEY '} }'
        APPLYTOKEN ::= 'MAX' | 'MIN' | 'AVG' | 'COUNT' | 'SUM'

        COLUMNS ::= 'COLUMNS:[' ANYKEY_LIST ']'

        // Comma-separated list of keys containing at least one key
        KEY_LIST ::= KEY | KEY ', ' KEY_LIST
        ANYKEY_LIST ::= ANYKEY | ANYKEY ', ' ANYKEY_LIST

        ANYKEY ::= KEY | applykey
        KEY ::= mkey | skey

        mkey ::= '"' mfield '"'
        skey ::= '"' sfield '"'
        inputstring ::= [^*]* // Zero or more of any character, except asterisk.
        applykey ::= [^_]+ // One or more of any character, except underscore.
        ```

        #### Course Offerings Fields

        When querying `course_offerings` kind, use these fields:

        ```ebnf
        mfield ::= 'avg' | 'pass' | 'fail' | 'audit' | 'year'
        sfield ::= 'title' | 'dept' | 'code' | 'instructor'
        ```

        #### Facilities Fields

        When querying `facilities` kind, use these fields:

        ```ebnf
        mfield ::= 'lat' | 'lon' | 'seats'
        sfield ::= 'address' | 'building' | 'furniture' | 'href' | 'name' | 'number' | 'type'
        ```

        #### Aggregation

        The query language supports performing calculations across a group of results.

        **Supported Aggregation Functions:**

        - **MAX**: Find the maximum value of an mfield. Returns the same number that is in the originating dataset.
        - **MIN**: Find the minimum value of an mfield. Returns the same number that is in the originating dataset.
        - **AVG**: Find the average value of an mfield. Returns a number rounded to two decimal places.
        - **SUM**: Find the sum of an mfield. Returns a number rounded to two decimal places.
        - **COUNT**: Count the number of unique occurrences of a field. Returns whole numbers.

        **Requirements:**

        - MAX/MIN/AVG/SUM should only be requested for numeric keys (mfield). COUNT can be requested for all keys.
        - The applykey in an APPLYRULE should be unique, so no two APPLYRULEs should share an applykey with the same name.
        - If GROUP is present, all COLUMNS keys must correspond to one of the GROUP keys or to applykeys defined in the APPLY block.

        #### Sort

        The query language supports sorting by:

        - **A single column** as in V1, e.g., `"ORDER": "avg"`
        - **Multiple columns with direction** by creating an object to sort by ascending or descending order and by multiple columns, e.g., `"ORDER": {"dir": "DOWN", "keys": ["maxSeats"]}`

        **Direction (`dir`)**: The order of the sorting is set by the direction:
        - `"UP"`: Sort results ascending
        - `"DOWN"`: Sort results descending

        **Keys**: The `keys` field allows for sorting by multiple keys (i.e., columns), where each additional key resolves ties for the previous key.

        Examples:
        - `"keys": ["avg"]`: sorts by a single key
        - `"keys": ["year", "avg"]`: sorts by multiple keys. In this case, the average should be used to resolve ties for entries in the same year

        **Requirements:**
        - All SORT keys must also be in the COLUMNS.
        - When sorting produces tied values (and no additional keys are specified to break ties), the relative order of those entries is not guaranteed.

        #### Wildcards

        You can use optional asterisks (`*`) in `IS` comparisons to match patterns.
        For example, `"IS": {"dept": "C*"}` matches any department that starts with "C".
        Because the asterisks can appear at the beginning and/or end, there are four possible forms:
        ```
        inputstring: Matches inputstring exactly
        *inputstring: Ends with inputstring
        inputstring*: Starts with inputstring
        *inputstring*: Contains inputstring
        ```
        Asterisks in the middle are not allowed (for example, `input*string`).

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              searchEasyCourses:
                summary: Basic course query
                description: This query produces course offerings that have an average greater than 99.
                value:
                  kind: course_offerings
                  query:
                    WHERE:
                      GT:
                        avg: 99
                    OPTIONS:
                      COLUMNS:
                        - dept
                        - avg

              searchLargeRooms:
                summary: Basic facilities query
                description: This query produces rooms with more than 100 seats.
                value:
                  kind: facilities
                  query:
                    WHERE:
                      GT:
                        seats: 350
                    OPTIONS:
                      COLUMNS:
                        - building
                        - number
                        - seats
                      ORDER:
                        - seats

              searchFullQuery:
                summary: Complex facilities query
                description: A query that uses the new components of the full query DSL.
                value:
                  kind: facilities
                  query:
                    WHERE:
                      IS:
                        building: "A*"
                    OPTIONS:
                      COLUMNS:
                        - building
                        - minSeats
                      ORDER:
                        dir: "DOWN"
                        keys: ["minSeats", "building"]
                    TRANSFORMATIONS:
                      GROUP: ["building"]
                      APPLY: [{ "minSeats": { MIN: "seats" } }]

      responses:
        "200":
          description: Results matching the search query retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Result records with keys matching the `COLUMNS` list from the query.
              examples:
                Results---Easy courses:
                  summary: Basic search results
                  description: Example search results for the simple query on the PAIR dataset that selects sections with an average greater than 99.
                  value: [
                    { "dept": "cnps", "avg": 99.19 },
                    { "dept": "math", "avg": 99.78 },
                    { "dept": "math", "avg": 99.78 }
                  ]
                Results---Large rooms:
                  summary: Facilities search results
                  description: Example search results for rooms with more than 350 seats from campus.zip.
                  value: [
                    { "building": "HEBB", "number": "100", "seats": 375 },
                    { "building": "CIRS", "number": "1250", "seats": 426 },
                    { "building": "OSBO", "number": "A", "seats": 442 },
                    { "building": "WOOD", "number": "2", "seats": 503 }
                  ]
                Results---Full query:
                  summary: Complex search results
                  description: Example search results for the complex query on the campus.zip dataset.
                  value: [
                    { "building": "AERL", "minSeats": 144 },
                    { "building": "ANSO", "minSeats": 26 },
                    { "building": "AUDX", "minSeats": 20 },
                    { "building": "ALRD", "minSeats": 20 },
                    { "building": "ANGU", "minSeats": 16 }
                  ]
        "400":
          description: Query does not conform to EBNF grammar
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ["Invalid query"]
                  message:
                    type: string
                    enum:
                      [
                        "Missing WHERE",
                        "Missing OPTIONS",
                        "Missing COLUMNS",
                        "Unknown key in COLUMNS",
                        "ORDER must be a key in COLUMNS",
                        "All ORDER keys must be in COLUMNS",
                        "Invalid sort direction (must be UP or DOWN)",
                        "WHERE must be an object with at most one FILTER",
                        "OPTIONS must be an object with COLUMNS and optional ORDER",
                        "AND must be a non-empty array of FILTER objects",
                        "OR must be a non-empty array of FILTER objects",
                        "NOT must be a FILTER object",
                        "LT must be an object with one mfield of type number",
                        "GT must be an object with one mfield of type number",
                        "EQ must be an object with one mfield of type number",
                        "IS must be an object with one sfield of type string",
                        "IS asterisks can only be first or last character",
                        "Cannot mix course_offerings and facilities fields in one query",
                        "Missing GROUP in TRANSFORMATIONS",
                        "Missing APPLY in TRANSFORMATIONS",
                        "GROUP must be a non-empty array",
                        "APPLY must be an array",
                        "When TRANSFORMATIONS is present, all COLUMNS must be in GROUP or APPLY",
                        "Invalid APPLYTOKEN (must be MAX, MIN, AVG, COUNT, or SUM)",
                        "MAX/MIN/AVG/SUM can only be applied to mfields",
                        "APPLYRULE must apply aggregation to a valid KEY",
                        "Duplicate applykey in APPLY",
                        "applykey cannot be empty or contain underscore",
                      ]
              examples:
                InvalidQueryMissingWhere:
                  summary: Missing WHERE clause
                  value:
                    error: "Invalid query"
                    message: "Missing WHERE"
                InvalidQueryInvalidColumnsKey:
                  summary: Invalid key in COLUMNS
                  value:
                    error: "Invalid query"
                    message: "Unknown key in COLUMNS"
                InvalidQueryOrderNotInColumns:
                  summary: ORDER not in COLUMNS
                  value:
                    error: "Invalid query"
                    message: "ORDER must be a key in COLUMNS"
                InvalidQueryMixedKinds:
                  summary: Mixed field kinds
                  value:
                    error: "Invalid query"
                    message: "Cannot mix course_offerings and facilities fields in one query"
                InvalidAggregationOnStringKey:
                  summary: Aggregation on non-numeric key
                  value:
                    error: "Invalid query"
                    message: "MAX/MIN/AVG/SUM can only be applied to mfields"
                DuplicateApplyKey:
                  summary: Duplicate applykey in APPLY
                  value:
                    error: "Invalid query"
                    message: "Duplicate applykey in APPLY"
                ColumnsNotInGroup:
                  summary: COLUMNS key not in GROUP or APPLY
                  value:
                    error: "Invalid query"
                    message: "When TRANSFORMATIONS is present, all COLUMNS must be in GROUP or APPLY"
                InvalidApplyToken:
                  summary: Invalid aggregation function
                  value:
                    error: "Invalid query"
                    message: "Invalid APPLYTOKEN (must be MAX, MIN, AVG, COUNT, or SUM)"
                InvalidSortDirection:
                  summary: Invalid sort direction
                  value:
                    error: "Invalid query"
                    message: "Invalid sort direction (must be UP or DOWN)"
                SortKeyNotInColumns:
                  summary: SORT key not in COLUMNS
                  value:
                    error: "Invalid query"
                    message: "All ORDER keys must be in COLUMNS"
                MissingTransformationsGroup:
                  summary: TRANSFORMATIONS without GROUP
                  value:
                    error: "Invalid query"
                    message: "Missing GROUP in TRANSFORMATIONS"
                MissingTransformationsApply:
                  summary: TRANSFORMATIONS without APPLY
                  value:
                    error: "Invalid query"
                    message: "Missing APPLY in TRANSFORMATIONS"
                EmptyGroupArray:
                  summary: GROUP is empty
                  value:
                    error: "Invalid query"
                    message: "GROUP must be a non-empty array"
                ApplykeyWithUnderscore:
                  summary: applykey is empty or contains underscore
                  value:
                    error: "Invalid query"
                    message: "applykey cannot be empty or contain underscore"
        "413":
          description: Too many results
          $ref: "#/components/responses/ResultTooLargeResponse"
        "422":
          description: Validation error in request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ["Validation failed"]
                  fields:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          [
                            "required but missing",
                            "expected to be course_offerings or facilities"
                          ]
                      query:
                        type: string
                        enum:
                          [
                            "required but missing",
                            "expected an object"
                          ]
              examples:
                MissingKind:
                  summary: Missing kind field
                  value:
                    error: "Validation failed"
                    fields:
                      kind: "required but missing"
                InvalidKind:
                  summary: Invalid kind value
                  value:
                    error: "Validation failed"
                    fields:
                      kind: "expected to be course_offerings or facilities"
                MissingQuery:
                  summary: Missing query field
                  value:
                    error: "Validation failed"
                    fields:
                      query: "required but missing"
                InvalidQueryType:
                  summary: Query is not an object
                  value:
                    error: "Validation failed"
                    fields:
                      query: "expected an object"

  /api/v1/courses:
    get:
      summary: Retrieve a list of courses
      description: Results are ordered by `id` ascending to ensure stable pagination.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 100
          description: Maximum number of courses to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of courses to skip
      responses:
        "200":
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
                  total:
                    type: integer
                    description: Overall total number of courses (ignores limit/offset)
                  limit:
                    type: integer
                    description: Maximum number returned in this request
                  offset:
                    type: integer
                    description: Number of courses skipped
              example:
                total: 2
                limit: 100
                offset: 0
                items:
                  - id: cpsc210
                    title: Software Construction
                    dept: Computer Science
                    code: "210"
                    links:
                      self: "/api/v1/courses/cpsc210"
                      sections: "/api/v1/courses/cpsc210/sections"
                  - id: cpsc310
                    title: Introduction to Software Engineering
                    dept: Computer Science
                    code: "310"
                    links:
                      self: "/api/v1/courses/cpsc310"
                      sections: "/api/v1/courses/cpsc310/sections"
        "400":
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ["Invalid request parameters"]
                  params:
                    type: object
                    properties:
                      limit:
                        type: string
                        enum: ["expected an integer between 1 and 5000"]
                      offset:
                        type: string
                        enum: ["expected an integer >= 0"]
              example:
                error: "Invalid request parameters"
                params:
                  limit: "expected an integer between 1 and 5000"
                  offset: "expected an integer >= 0"

  /api/v1/courses/{course}:
    parameters:
      - $ref: "#/components/parameters/CourseParam"
    get:
      summary: Retrieve a course
      responses:
        "200":
          description: Course retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
              example:
                id: cpsc310
                title: Introduction to Software Engineering
                dept: Computer Science
                code: "310"
                links:
                  self: "/api/v1/courses/cpsc310"
                  sections: "/api/v1/courses/cpsc310/sections"
        "404":
          description: The course does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
              example:
                error: "Not found"
                message: "no course with id 'cpsc310'"
    put:
      summary: Create or replace a course
      description: If the course already exists, the entire course is replaced; otherwise it is created.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Course"
                - type: object
                  required:
                    - title
                    - dept
                    - code
            example:
              title: Introduction to Software Engineering
              dept: Computer Science
              code: "310"
      responses:
        "201":
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
              example:
                id: cpsc310
                title: Introduction to Software Engineering
                dept: Computer Science
                code: "310"
                links:
                  self: "/api/v1/courses/cpsc310"
                  sections: "/api/v1/courses/cpsc310/sections"
        "204":
          description: Course updated successfully
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: ["Validation failed"]
                  fields:
                    type: object
                    properties:
                      title:
                        type: string
                        enum: ["required but missing", "expected a string"]
                      dept:
                        type: string
                        enum: ["required but missing", "expected a string"]
                      code:
                        type: string
                        enum: ["required but missing", "expected a string"]
              example:
                error: "Validation failed"
                fields:
                  dept: "required but missing"
                  code: "expected a string"
    delete:
      summary: Remove a course
      description: The course and all of its sections are permanently removed. The response includes the course metadata and a count of sections that were removed.
      responses:
        "200":
          description: Course removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    description: The title of the course.
                    type: string
                  dept:
                    description: The department that offers the course.
                    type: string
                  code:
                    description: The course code identifier.
                    type: string
                  sections:
                    description: The number of sections that were removed with the course.
                    type: integer
                    minimum: 0
              example:
                id: cpsc310
                title: Introduction to Software Engineering
                dept: Computer Science
                code: "310"
                sections: 2
        "404":
          description: The course does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
              example:
                error: "Not found"
                message: "no course with id 'cpsc310'"

  /api/v1/courses/{course}/sections:
    parameters:
      - $ref: "#/components/parameters/CourseParam"
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
        description: Maximum number of sections to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
